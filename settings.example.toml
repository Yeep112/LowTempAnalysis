# ============================================================
#  全域設定（只需要改一次）
#  Windows 路徑請用單引號 '...'，反斜線就不用寫兩次
# ============================================================

# 所有樣品資料夾的最上層；資料總表與「最新 .db」會從這裡往下找
# （也可以在軟體的 ⚙ 設定 → 資料與輸出 裡設定）
data_root = ''

# 分析結果存放位置。可用的代號：
#   {db_dir}   = .db 所在資料夾
#   {db_name}  = .db 檔名（不含副檔名）
#   {job_file} = 分析設定檔名稱（不含副檔名）
# 預設存在樣品資料夾的 01 Figure 底下，跟原本 notebook 一樣
output_dir = '{db_dir}\01 Figure\{job_file}'

# 圖片格式與解析度
fig_format = "jpg"
dpi = 300
